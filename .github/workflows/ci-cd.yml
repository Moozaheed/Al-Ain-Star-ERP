name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ── Backend CI ───────────────────────────────────────────────
  backend-ci:
    name: Backend (Laravel & PHP)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: erp_testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    defaults:
      run:
        working-directory: erp-backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, zip, gd
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: erp-backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('erp-backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Environment File
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Database Migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: erp_testing
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: php artisan migrate --force

      - name: Run Tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: erp_testing
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: php artisan test

  # ── Frontend CI ──────────────────────────────────────────────
  frontend-ci:
    name: Frontend (Next.js & TypeScript)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: erp-frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: erp-frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Check TypeScript Compilation & Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_APP_NAME: Auto Parts ERP
        run: npm run build

  # ── Production Deployment (CD) ───────────────────────────────
  deploy-production:
    name: Deploy to Production
    environment: Production
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Production Server Configuration
        id: check-secrets
        run: |
          if [ -z "${{ secrets.PROD_HOST }}" ] || [ -z "${{ secrets.PROD_USER }}" ] || [ -z "${{ secrets.PROD_SSH_KEY }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "Notice: Production secrets (PROD_HOST, PROD_USER, PROD_SSH_KEY) are not yet configured."
            echo "Deployment step is safely skipped until the production server is connected."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy via SSH
        if: steps.check-secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT || 22 }}
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.PROD_DEPLOY_PATH || '/var/www/erp' }}"
            cd $DEPLOY_PATH

            echo "Fetching latest changes from main..."
            git fetch origin main
            git reset --hard origin/main

            echo "Updating backend..."
            cd $DEPLOY_PATH/erp-backend
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force

            # TEMPORARY — client demo data (see database/seeders/DemoDataSeeder.php).
            # Safe to run every deploy: everything it creates uses firstOrCreate or
            # an explicit existence check, so re-running never duplicates anything.
            # Remove this line once the demo is over — the data itself is removed
            # separately via `php artisan demo:cleanup`, not by deleting this step.
            php artisan db:seed --class=DemoDataSeeder --force

            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan queue:restart || true
            chown -R www-data:www-data storage bootstrap/cache 2>/dev/null || true
            chmod -R 775 storage bootstrap/cache 2>/dev/null || true

            echo "Updating frontend..."
            cd $DEPLOY_PATH/erp-frontend
            npm ci --production=false
            npm run build
            if command -v pm2 &> /dev/null; then
              pm2 reload erp-frontend || pm2 start npm --name "erp-frontend" -- start -- -p 3000
            fi

            echo "Deployment successfully completed."
