services:

  # ── MySQL 8.0 ────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: erp_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${DB_DATABASE:-erp}
      MYSQL_USER: ${DB_USERNAME:-erp}
      MYSQL_PASSWORD: ${DB_PASSWORD:-erp_secret}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./erp-context/db-schemas/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "${DB_PORT:-3306}:3306"
    networks:
      - erp_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis 7 ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: erp_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - erp_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Laravel Backend (PHP-FPM 8.3) ────────────────────────────
  backend:
    build:
      context: ./erp-backend
      dockerfile: Dockerfile
      target: dev
    container_name: erp_backend
    restart: unless-stopped
    volumes:
      - ./erp-backend:/var/www/html
      - /var/www/html/vendor           # vendor stays in container
    environment:
      APP_ENV: local
      APP_KEY: ${APP_KEY:-}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-erp}
      DB_USERNAME: ${DB_USERNAME:-erp}
      DB_PASSWORD: ${DB_PASSWORD:-erp_secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      QUEUE_CONNECTION: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - erp_net

  # ── Nginx (serves Laravel) ───────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: erp_nginx
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:80"
    volumes:
      - ./erp-backend:/var/www/html:ro
      - ./erp-backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - erp_net

  # ── Queue Worker (Laravel Horizon) ───────────────────────────
  queue:
    build:
      context: ./erp-backend
      dockerfile: Dockerfile
      target: dev
    container_name: erp_queue
    restart: unless-stopped
    command: php artisan horizon
    volumes:
      - ./erp-backend:/var/www/html
      - /var/www/html/vendor
    environment:
      APP_ENV: local
      APP_KEY: ${APP_KEY:-}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-erp}
      DB_USERNAME: ${DB_USERNAME:-erp}
      DB_PASSWORD: ${DB_PASSWORD:-erp_secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
      QUEUE_CONNECTION: redis
    depends_on:
      - backend
      - redis
    networks:
      - erp_net

  # ── Scheduler (Laravel cron) ─────────────────────────────────
  scheduler:
    build:
      context: ./erp-backend
      dockerfile: Dockerfile
      target: dev
    container_name: erp_scheduler
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - ./erp-backend:/var/www/html
      - /var/www/html/vendor
    environment:
      APP_ENV: local
      APP_KEY: ${APP_KEY:-}
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:-erp}
      DB_USERNAME: ${DB_USERNAME:-erp}
      DB_PASSWORD: ${DB_PASSWORD:-erp_secret}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
    depends_on:
      - backend
    networks:
      - erp_net

  # ── Next.js Frontend ─────────────────────────────────────────
  frontend:
    build:
      context: ./erp-frontend
      dockerfile: Dockerfile
      target: dev
    container_name: erp_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./erp-frontend:/app
      - /app/node_modules          # node_modules stays in container
      - /app/.next                 # .next cache stays in container
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8000}/api/v1
      NEXT_PUBLIC_APP_NAME: Auto Parts ERP
      NODE_ENV: development
    depends_on:
      - nginx
    networks:
      - erp_net

  # ── Mailpit (local email testing) ────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: erp_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"   # Web UI
      - "1025:1025"                         # SMTP
    networks:
      - erp_net

volumes:
  mysql_data:
  redis_data:

networks:
  erp_net:
    driver: bridge
